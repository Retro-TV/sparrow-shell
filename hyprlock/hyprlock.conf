# Portable Sparrow Hyprlock default.
# Install only when the user does not already have ~/.config/sparrow/hyprlock.conf.
# The screenshot background has a solid fallback and requires no wallpaper file.

$font = Sans

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    color = rgba(17, 17, 27, 1.0)
    blur_passes = 5
    blur_size = 5
}

# User identity stays dynamic and does not depend on a bundled avatar image.
label {
    monitor =
    text = $USER
    font_family = $font
    font_size = 16
    color = rgb(cdd6f4)
    position = 0, 160
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 200, 30
    outline_thickness = 3
    inner_color = rgba(205, 214, 244, 0.20)
    outer_color = rgba(205, 214, 244, 0.40)
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    font_color = rgb(cdd6f4)
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text =
    fail_text =
    dots_size = 0.4
    dots_spacing = 0.3
    position = 0, 80
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] date +"%l:%M"
    font_size = 120
    font_family = $font
    position = 0, -200
    halign = center
    valign = top
    color = rgba(205, 214, 244, 0.55)
}

label {
    monitor =
    text = cmd[update:60000] date +"%a · %e %b %Y"
    font_size = 16
    font_family = $font
    position = 0, -380
    halign = center
    valign = top
    color = rgb(cdd6f4)
}
