# Sparrow's portable Kitty defaults. Install this as
# $XDG_CONFIG_HOME/kitty/kitty.conf, preserving any existing user config.
# The wallpaper pipeline writes this sibling file from the canonical Matugen
# palette; globinclude is quiet until the first palette has been generated.
globinclude sparrow-colors.conf

# Match the desktop Kitty reference's typography and spacing. Kitty reports
# 120 DPI on Sparrow's 1.25-scaled laptop output, so point-sized font and
# margins scale together; keep the reference margin in points.
font_family JetBrains Mono Nerd Font
font_size 11.0
window_margin_width 21.75
window_padding_width 0
single_window_margin_width -1
single_window_padding_width -1

# Preserve the reference tab structure. Its colors come from the generated
# Sparrow palette include above.
tab_bar_style fade
tab_bar_edge bottom
tab_bar_align left
tab_bar_min_tabs 2
tab_separator " ┇"

# Reference cursor and shell behavior. Niri supplies the compositor border,
# radius and shadow globally; no Kitty-specific Niri rule is needed.
cursor_shape beam
cursor_trail 1
shell fish
confirm_os_window_close 0
auto_reload_config 0.1
